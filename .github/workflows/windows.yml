name: Native desktop contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: false
      - name: Install the local knowledge runtime
        run: |
          uv venv
          uv pip install -e '.[test]'
      - name: Windows process ownership
        if: runner.os == 'Windows'
        env:
          HOME: ${{ runner.temp }}/knowledge-test-home
          USERPROFILE: ${{ runner.temp }}/knowledge-test-home
        run: uv run --no-sync python -m pytest -q tests/test_windows_process_ownership.py tests/test_windows_empty_lock.py
      - name: Component tests
        env:
          HOME: ${{ runner.temp }}/knowledge-test-home
          USERPROFILE: ${{ runner.temp }}/knowledge-test-home
          MINDIE_FRAMEWORK_SOURCE: tests/fixtures/production-parsers
        run: |
          uv run --no-sync python -c "import os; from pathlib import Path; Path(os.environ['HOME']).mkdir(parents=True, exist_ok=True)"
          uv run --no-sync python -m pytest -q tests --junitxml=native-knowledge.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-knowledge-results
          path: native-knowledge.xml
