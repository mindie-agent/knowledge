name: Native desktop contracts
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, name: "contracts (ubuntu-latest)", shard: 0, shards: 1}
          - {os: macos-latest, name: "contracts (macos-latest)", shard: 0, shards: 1}
          - {os: windows-latest, name: "contracts (windows-latest, 1/3)", shard: 0, shards: 3}
          - {os: windows-latest, name: "contracts (windows-latest, 2/3)", shard: 1, shards: 3}
          - {os: windows-latest, name: "contracts (windows-latest, 3/3)", shard: 2, shards: 3}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: false
      - name: Install the local knowledge runtime
        run: |
          uv venv
          uv pip install -e '.[test]'
      - name: Component tests
        env:
          HOME: ${{ runner.temp }}/knowledge-test-home
          USERPROFILE: ${{ runner.temp }}/knowledge-test-home
          MINDIE_FRAMEWORK_SOURCE: tests/fixtures/production-parsers
        run: |
          uv run --no-sync python -c "import os; from pathlib import Path; Path(os.environ['HOME']).mkdir(parents=True, exist_ok=True)"
          uv run --no-sync python .github/scripts/run_native_tests.py --shard ${{ matrix.shard }} --shards ${{ matrix.shards }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-${{ matrix.shard }}-knowledge-results
          path: |
            native-knowledge.xml
            native-knowledge-files.json
