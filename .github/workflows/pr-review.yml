name: Package checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]' -e tools/knowledge-intake
      - name: Test package and installed wheel
        run: python -m pytest -q tests
      - name: Check public Markdown for accidental private data
        run: python -m vaws_knowledge.corpus_check --repo .
