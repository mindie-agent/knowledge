name: Independent knowledge intake

on:
  pull_request:
    paths:
      - 'tools/knowledge-intake/**'
      - '.github/workflows/knowledge-intake.yml'
  push:
    branches: [main]
    paths:
      - 'tools/knowledge-intake/**'
      - '.github/workflows/knowledge-intake.yml'

permissions:
  contents: read

jobs:
  independent-formats:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: windows-latest, python: '3.13'}
          - {os: macos-latest, python: '3.13'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install only the independent package and optional format tests
        run: |
          python -m venv .intake-env
          if [ "$RUNNER_OS" = "Windows" ]; then
            intake_python="$PWD/.intake-env/Scripts/python.exe"
          else
            intake_python="$PWD/.intake-env/bin/python"
          fi
          echo "INTAKE_PY=$intake_python" >> "$GITHUB_ENV"
          uv pip install --python "$intake_python" './tools/knowledge-intake[formats,test]'
          "$intake_python" -I -c "import importlib.util; assert importlib.util.find_spec('mindie_knowledge') is None"
      - name: Real formats, bounded HTTP/Git, and native result handoff
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          "$INTAKE_PY" -m unittest discover -s tools/knowledge-intake/tests -v 2>&1 | tee intake-tests.log
      - name: Build and install wheel without optional or VAWS dependencies
        run: |
          uv build tools/knowledge-intake --out-dir intake-dist
          "$INTAKE_PY" tools/knowledge-intake/tests/wheel_smoke.py intake-dist/knowledge_intake-0.1.0-py3-none-any.whl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            intake-tests.log
            intake-dist/*
