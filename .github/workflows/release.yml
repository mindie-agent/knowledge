name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@3bf7fa6efc111876cc31c602f11dcd0c029769d7
    with:
      benchmark-ref: 3bf7fa6efc111876cc31c602f11dcd0c029769d7
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        MINDIE_FRAMEWORK_SOURCE=tests/fixtures/production-parsers .venv/bin/python -m pytest -q -m "not live_npu"
