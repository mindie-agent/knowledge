name: release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read
  deployments: read

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@main
    secrets:
      MINDIE_RELEASE_DEPLOY_KEY: ${{ secrets.MINDIE_RELEASE_DEPLOY_KEY }}
    with:
      release-notes-path: docs/releases/knowledge-0.13.16.md
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        MINDIE_FRAMEWORK_SOURCE=tests/fixtures/production-parsers .venv/bin/python -m pytest -q -m "not live_npu"
