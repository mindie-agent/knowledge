name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: mindie-agent/mindie-bench/.github/workflows/publish-release.yml@484b80621aaf9293c559786d0ef2174c79a0dbb4
    with:
      benchmark-ref: 484b80621aaf9293c559786d0ef2174c79a0dbb4
      release-notes-path: docs/releases/knowledge-0.13.7.md
      setup-command: |
        uv venv --python 3.13 && uv pip install -e ".[test]"
      test-command: |
        MINDIE_FRAMEWORK_SOURCE=tests/fixtures/production-parsers .venv/bin/python -m pytest -q -m "not live_npu"
