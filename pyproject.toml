[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-knowledge"
version = "0.7.5"
description = "Domain knowledge, experience collection, distribution and independent usefulness feedback"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-knowledge = "mindie_knowledge.loop.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/knowledge"
Repository = "https://github.com/mindie-agent/knowledge"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mindie_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "mindie_knowledge/data/corpus"
