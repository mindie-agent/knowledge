[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-knowledge"
version = "0.8.2"
description = "Local knowledge and experience loop: bounded capture, optional community sharing, Git-published retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "PyYAML>=6.0",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@7c56f6b510b48fa60f256b46f71805e3be61eed8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-knowledge = "mindie_knowledge.loop.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/knowledge"
Repository = "https://github.com/mindie-agent/knowledge"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mindie_knowledge"]
