[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-knowledge"
version = "0.13.25"
description = "Local knowledge and experience loop: bounded capture, optional community sharing, Git-published retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "PyYAML>=6.0",
  "packaging>=24",
  "semantic-version==2.10.0",
  "reme-ai[as] @ git+https://github.com/agentscope-ai/ReMe@4c54c2b650038eff2a5d0d77aaa61b3e836f1b18",
  "langmem==0.0.30",
  "pywin32==312; sys_platform == 'win32'",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@7464cbb4381e9dc996871d192eb3f05f61dfdb28",
  "mindie-harness @ git+https://github.com/mindie-agent/harness@440b8bd3dfa47f3c2e2131259c391c8cee14f13d",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-xdist>=3.5,<4", "jsonschema>=4,<5"]

[project.scripts]
mindie-knowledge = "mindie_knowledge.loop.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/knowledge"
Repository = "https://github.com/mindie-agent/knowledge"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mindie_knowledge"]
