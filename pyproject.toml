[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-knowledge"
version = "0.11.0"
description = "Local knowledge and experience loop: bounded capture, optional community sharing, Git-published retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "PyYAML>=6.0",
  "reme-ai[as] @ git+https://github.com/agentscope-ai/ReMe@4c54c2b650038eff2a5d0d77aaa61b3e836f1b18",
  "langmem==0.0.30",
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@7eed6cdb9935f2922b5b280e9d78ad8eb823f5ce",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mindie-knowledge = "mindie_knowledge.loop.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/knowledge"
Repository = "https://github.com/mindie-agent/knowledge"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mindie_knowledge"]
