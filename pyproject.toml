[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindie-knowledge"
version = "0.7.5"
description = "Domain knowledge, experience collection, distribution and independent usefulness feedback"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "vLLM Ascend contributors" },
]
dependencies = [
  "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@db16926ed04fdaede28824b6e4f3aff5fb35e603",
  "PyYAML>=6.0",
  "openviking==0.4.19",
  "openviking-sdk==0.1.10",
  "fastembed==0.8.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "tree-sitter==0.25.2", "tree-sitter-cpp==0.23.4"]
code = ["tree-sitter==0.25.2", "tree-sitter-cpp==0.23.4"]

[project.scripts]
mindie-knowledge = "mindie_knowledge.loop.cli:main"

[project.urls]
Homepage = "https://github.com/mindie-agent/knowledge"
Repository = "https://github.com/mindie-agent/knowledge"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mindie_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "mindie_knowledge/data/corpus"
